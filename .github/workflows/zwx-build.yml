name: zwx-build

on:
  push:
    branches: [zwx-patches]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
      - name: Ensure dist
        run: mkdir -p dist && [ -f dist/index.html ] || echo "<html/>" > dist/index.html
      - name: Pipeline tests
        run: |
          cd src-tauri && cargo test --lib pipeline::

  build-windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
      - run: npm install --legacy-peer-deps
      - name: Build NSIS installer (no updater signing)
        shell: pwsh
        run: |
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding ascii zwx-tauri.json
          npx tauri build --bundles nsis --config zwx-tauri.json
      - uses: actions/upload-artifact@v4
        with:
          name: antigravity-zwx-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
